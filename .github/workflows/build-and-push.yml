# Builds both LedgerFlow images and pushes them to the ECR repositories created by
# infra/terraform, authenticating via OIDC role assumption — no long-lived AWS
# access keys are stored as GitHub secrets.
#
# One-time setup required before this workflow can run:
#   1. Create an IAM OIDC identity provider for token.actions.githubusercontent.com
#      (skip if one already exists in the account).
#   2. Create an IAM role trusting that provider, scoped to this repo, with
#      permission to push to the two ECR repos from infra/terraform (ecr:*
#      actions scoped to their ARNs) — see AWS's "configure-aws-credentials" docs
#      for the exact trust policy shape.
#   3. Add that role's ARN as a repository variable named AWS_DEPLOY_ROLE_ARN
#      (Settings -> Secrets and variables -> Actions -> Variables).
#
# Until that's done, this workflow will fail at the "configure-aws-credentials"
# step — the manual docker build/push commands in infra/terraform/README.md work
# without any of this setup.
#
# Manual-trigger only for now (no `push` trigger): the AWS infra from
# infra/terraform hasn't been applied yet either, so this would fail one step
# later even with credentials configured (no ECR repo/ECS service to push to).
# Once you've run `terraform apply` and set AWS_DEPLOY_ROLE_ARN, either run this
# manually from the Actions tab, or add back a `push: branches: [main]` trigger.

name: Build and push images

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push app image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/ledgerflow-app:${{ github.sha }} -t $REGISTRY/ledgerflow-app:latest ledgerflow
          docker push $REGISTRY/ledgerflow-app:${{ github.sha }}
          docker push $REGISTRY/ledgerflow-app:latest

      - name: Build and push fraud-service image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/ledgerflow-fraud-service:${{ github.sha }} -t $REGISTRY/ledgerflow-fraud-service:latest ledgerflow/fraud-service
          docker push $REGISTRY/ledgerflow-fraud-service:${{ github.sha }}
          docker push $REGISTRY/ledgerflow-fraud-service:latest

      - name: Force new ECS deployments
        run: |
          aws ecs update-service --cluster ledgerflow-cluster --service ledgerflow-app --force-new-deployment
          aws ecs update-service --cluster ledgerflow-cluster --service ledgerflow-fraud-service --force-new-deployment
