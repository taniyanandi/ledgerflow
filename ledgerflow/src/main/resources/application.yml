spring:
  application:
    name: ledgerflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerflow}
    username: ${DB_USER:ledgerflow}
    password: ${DB_PASSWORD:ledgerflow}
  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    # V5/V6 ("fix currency column type" migrations) were applied to this DB historically
    # but their .sql files aren't present in this checkout; tolerate the gap rather than
    # failing validation on migrations we can't resolve locally.
    ignore-migration-patterns: "*:missing"
  kafka:
    # 29092 is the HOST listener in docker-compose.yml, advertised as localhost:29092 for
    # apps run directly on the host; the containerized 'app' service overrides this to
    # kafka:9092 (the internal listener) via its own KAFKA_BOOTSTRAP env var.
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# LedgerFlow-specific settings
ledgerflow:
  events:
    # 'kafka' publishes to a broker and persists an audit trail; 'noop' just logs.
    transport: ${EVENTS_TRANSPORT:kafka}
  fraud:
    base-url: ${FRAUD_BASE_URL:http://localhost:8000}
  ai:
    # 'template' generates narratives from the SHAP reasons locally, no AWS needed —
    # the safe default for local dev, tests, and CI. Set to 'bedrock' to use a real
    # Claude model on AWS Bedrock (requires AWS credentials via the default provider
    # chain, and Bedrock model access enabled in-console for the target region).
    provider: ${AI_PROVIDER:template}
    bedrock:
      region: ${AWS_REGION:us-east-1}
      model-id: ${AI_MODEL_ID:anthropic.claude-3-5-haiku-20241022-v1:0}
      timeout-ms: ${AI_TIMEOUT_MS:8000}
      max-tokens: ${AI_MAX_TOKENS:600}
    assistant:
      max-tool-hops: ${AI_MAX_TOOL_HOPS:3}

# Spring AI's Bedrock autoconfiguration activates whenever the starter is on the
# classpath; keep it inert until 'bedrock' is actually selected above.
spring.ai.bedrock.converse.chat.enabled: ${SPRING_AI_BEDROCK_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
